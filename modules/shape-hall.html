<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>形与集合 · 图形规律 — Mathematical Thinking</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
  <link rel="stylesheet" href="../css/shapehall.css?v=1">
  <link rel="stylesheet" href="../css/owl.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-logo">∑</span>
        <span class="brand-name">形与集合 · 图形规律</span>
      </div>
      <nav class="main-nav">
        <a href="../index.html">← 返回首页</a>
      </nav>
    </div>
  </header>

  <main class="container game-wrap">
    <!-- 模式选择 -->
    <section id="screen-start" class="screen">
      <h1 class="section-title">选择玩法</h1>
      <p class="mode-hint">每局 10 题，慢慢想，答对得星星 ⭐</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="solid">
          <span class="mode-icon">⚽</span>
          <span class="mode-name">立体图形</span>
          <span class="mode-desc">球体、正方体、圆柱体</span>
        </button>
        <button class="mode-card" data-mode="equal">
          <span class="mode-icon">✂️</span>
          <span class="mode-name">等分</span>
          <span class="mode-desc">分成了几份？</span>
        </button>
        <button class="mode-card" data-mode="classify">
          <span class="mode-icon">🔍</span>
          <span class="mode-name">谁是梯形</span>
          <span class="mode-desc">哪个不是梯形？</span>
        </button>
        <button class="mode-card" data-mode="include">
          <span class="mode-icon">🔺</span>
          <span class="mode-name">三角水果</span>
          <span class="mode-desc">三角形里有几个水果</span>
        </button>
        <button class="mode-card" data-mode="puzzle">
          <span class="mode-icon">🧩</span>
          <span class="mode-name">拼合计数</span>
          <span class="mode-desc">用了几块三角形？</span>
        </button>
        <button class="mode-card" data-mode="redGrid">
          <span class="mode-icon">🔴</span>
          <span class="mode-name">填红方块</span>
          <span class="mode-desc">找规律，补上去</span>
        </button>
      </div>
    </section>

    <!-- 游戏 -->
    <section id="screen-game" class="screen" style="display:none">
      <div class="game-top">
        <span id="mode-title" class="game-mode"></span>
        <span id="round-info">第 1 / 10 题</span>
        <span id="score-info">⭐ 0</span>
        <button id="btn-sound" type="button" title="声音开关">🔊</button>
      </div>
      <div class="progress"><div id="progress-fill"></div></div>
      <p id="q-prompt" class="q-prompt"></p>
      <div id="question-area"></div>
      <p id="hint" class="hint"></p>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
    </section>

    <!-- 结算 -->
    <section id="screen-end" class="screen" style="display:none">
      <h2 class="section-title">本轮完成！</h2>
      <p id="end-stars" class="end-stars"></p>
      <p id="end-msg" class="end-msg"></p>
      <p id="end-time" class="mode-hint"></p>
      <div class="end-actions">
        <button id="btn-again" class="btn btn-primary">再玩一次</button>
        <button id="btn-menu" class="btn btn-ghost">换个玩法</button>
        <a class="btn btn-ghost" href="report.html">看学习报告</a>
      </div>
    </section>
  </main>

  <script src="../js/voice-data.js?v=4" async></script>
  <script src="../js/voice.js?v=2" defer></script>
  <script src="../js/owl.js?v=2" defer></script>
  <script src="../js/game-shapehall.js?v=1" defer></script>
</body>
</html>
